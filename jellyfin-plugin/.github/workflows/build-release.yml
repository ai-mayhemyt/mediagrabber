name: Build & Publish Jellyfin Plugin (All Versions)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - series: "10.8"
            dotnet: "6.0.x"
            abi: "10.8.0.0"
            version: "2.0.0.1"
          - series: "10.9"
            dotnet: "8.0.x"
            abi: "10.9.0.0"
            version: "2.0.0.2"
          - series: "10.10"
            dotnet: "8.0.x"
            abi: "10.10.0.0"
            version: "2.0.0.3"
          - series: "10.11"
            dotnet: "9.0.x"
            abi: "10.11.0.0"
            version: "2.0.0.4"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Build for Jellyfin ${{ matrix.series }}
        run: |
          dotnet publish MediaGrabber.Jellyfin/MediaGrabber.Jellyfin.csproj \
            -c Release \
            -p:JellyfinSeries=${{ matrix.series }} \
            -o out/${{ matrix.series }}

      - name: Package Jellyfin Plugin Zip
        run: |
          mkdir -p artifacts
          cat > out/${{ matrix.series }}/meta.json <<EOF
          {
            "guid": "c7f3a1e4-9b2d-4c6f-a810-4e92d3b17c50",
            "name": "MediaGrabber",
            "overview": "Download YouTube, Music, Spotify & Gallery media directly from Jellyfin.",
            "description": "Connects Jellyfin to MediaGrabber with required API key auth.",
            "owner": "ai-mayhemyt",
            "category": "General",
            "version": "${{ matrix.version }}",
            "targetAbi": "${{ matrix.abi }}"
          }
          EOF
          (cd out/${{ matrix.series }} && zip -r ../../artifacts/mediagrabber-jellyfin-${{ matrix.series }}.zip MediaGrabber.Jellyfin.dll meta.json)

      - uses: actions/upload-artifact@v4
        with:
          name: mediagrabber-jellyfin-${{ matrix.series }}
          path: artifacts/mediagrabber-jellyfin-${{ matrix.series }}.zip

  publish-release:
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Update manifest.json Checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          with open('manifest.json', 'r') as f:
              manifest = json.load(f)
          map_zip = {
              '10.11.0.0': 'artifacts/mediagrabber-jellyfin-10.11.zip',
              '10.10.0.0': 'artifacts/mediagrabber-jellyfin-10.10.zip',
              '10.9.0.0': 'artifacts/mediagrabber-jellyfin-10.9.zip',
              '10.8.0.0': 'artifacts/mediagrabber-jellyfin-10.8.zip',
          }
          for ver in manifest[0]['versions']:
              zpath = map_zip.get(ver['targetAbi'])
              if zpath and os.path.exists(zpath):
                  with open(zpath, 'rb') as zf:
                      ver['checksum'] = hashlib.md5(zf.read()).hexdigest()
          with open('artifacts/manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mediagrabber-jellyfin-*.zip
            artifacts/manifest.json

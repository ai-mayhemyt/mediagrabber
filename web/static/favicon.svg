<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="mg-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#000"/>
  <g transform="translate(50,55) rotate(-40) translate(-50,-55)">
    <!-- Base truss -->
    <path d="M 42 55 L 35 86 M 58 55 L 65 86 M 42 55 L 65 86 M 58 55 L 35 86 M 35 86 L 65 86"
          stroke="url(#mg-grad)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Dish outer -->
    <path d="M 22 42 A 28 10 0 0 0 78 42" stroke="url(#mg-grad)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Dish inner -->
    <path d="M 30 42 A 20 7 0 0 0 70 42" stroke="url(#mg-grad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Feed arm + box -->
    <line x1="50" y1="45" x2="50" y2="20" stroke="white" stroke-width="3"/>
    <rect x="44" y="12" width="12" height="8" fill="white" rx="2"/>
    <!-- Signal arcs -->
    <path d="M 58 15 A 12 12 0 0 1 64 26" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 62 10 A 20 20 0 0 1 72 28" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 66 5 A 28 28 0 0 1 80 30" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>